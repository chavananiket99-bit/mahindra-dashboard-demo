<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mahindra Tooling Tracker</title>
    <link
      rel="stylesheet"
      href="https://fontsstorage.blob.core.windows.net/html/css/georama.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --red: #a9153d;
        --navy: #071b2d;
        --ink: #243746;
        --muted: #71818d;
        --bg: #f3f6f8;
        --border: #dce4e9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Georama-Regular", Arial, sans-serif;
        font-size: 12px;
      }
      .topbar {
        height: 68px;
        background: #fff;
        border-bottom: 2px solid #a9153d;
        box-shadow: 0 1px 5px rgba(7, 27, 45, 0.06);
      }
      .header-inner {
        height: 68px;
      }
      .mahindra-logo img {
        width: 170px;
        height: auto;
      }
      .top-menu {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .top-menu a {
        color: #465967;
        text-decoration: none;
        padding: 11px 16px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
      }
      .top-menu a:hover,
      .top-menu a.active {
        background: #f5eaf0;
        color: var(--red);
      }
      .top-menu a.active {
        box-shadow: inset 0 -2px 0 var(--red);
      }
      .profile-btn {
        border: 0;
        background: transparent;
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 5px 7px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #a9153d;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 11px;
      }
      .profile-name {
        font-size: 12px;
        font-weight: 800;
        text-align: left;
      }
      .profile-role {
        font-size: 11px;
        color: #7b8993;
      }
      .dropdown-menu {
        border: 1px solid var(--border);
        box-shadow: 0 8px 24px #071b2d22;
        border-radius: 8px;
      }
      .dropdown-item {
        font-size: 12px;
        padding: 9px 14px;
      }
      .page {
        padding: 24px 28px 40px;
        max-width: 1700px;
        margin: auto;
      }
      .page-title {
        font-size: 23px;
        font-weight: 800;
        color: var(--navy);
        margin: 0;
      }
      .sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      .accent {
        height: 3px;
        width: 45px;
        background: var(--red);
        border-radius: 3px;
        margin-top: 9px;
      }
      .filter-card,
      .table-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 2px 9px #071b2d0c;
        margin-bottom: 14px;
      }
      .filter-card {
        padding: 15px 17px;
      }
      .filter-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 11px;
        align-items: end;
      }
      .filter-label {
        font-size: 10px;
        text-transform: uppercase;
        font-weight: 800;
        color: #687a87;
        margin-bottom: 5px;
      }
      .filter-control {
        height: 36px;
        font-size: 12px;
      }
      .apply,
      .tool-btn {
        height: 34px;
        border: 1px solid #d7e0e5;
        background: #fff;
        border-radius: 6px;
        color: #617481;
        font-size: 10px;
        padding: 0 11px;
        font-weight: 700;
      }
      .apply {
        background: var(--red);
        color: #fff;
        border-color: var(--red);
      }
      .table-head {
        padding: 15px 17px 11px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .table-head-toolbar {
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
      }
      .table-title {
        font-size: 16px;
        font-weight: 800;
        color: var(--navy);
      }
      .table-meta {
        font-size: 10px;
        color: #7a8994;
      }
      .table-tools {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .engineering-table-wrap {
        width: 100%;
        overflow: auto;
        background: #fff;
        border-top: 1px solid var(--border);
        scrollbar-width: thin;
      }
      .engineering-table {
        display: flex;
        width: 100%;
        min-width: 900px;
        align-items: stretch;
        background: #fff;
      }
      .engineering-section {
        display: flex;
        flex: 0 0 48px;
        min-width: 48px;
        overflow: hidden;
        background: #fff;
        border-right: 1px solid var(--border);
        transition: flex-basis 0.2s ease;
      }
      .engineering-section.expanded {
        flex: 1 1 0;
        min-width: 0;
      }
      .section-vertical-bar {
        flex: 0 0 48px;
        width: 48px;
        padding: 12px 5px;
        border: 0;
        border-right: 1px solid var(--border);
        background: #eef2f5;
        color: #405463;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .vertical-text {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }
      .vertical-icon {
        font-size: 14px;
      }
      .engineering-section.expanded .section-vertical-bar,
      .engineering-table.show-all-mode .section-vertical-bar {
        display: none;
      }
      .section-content {
        flex: 1 1 auto;
        min-width: 0;
        background: #fff;
        overflow-x: auto;
      }
      .engineering-section:not(.expanded) .section-content {
        display: none;
      }
      .section-header {
        min-height: 48px;
        padding: 7px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #f1f4f6;
        color: #344b5a;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
      }
      .engineering-section.expanded .section-header {
        border-top: 2px solid var(--red);
      }
      .section-head-actions {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .icon-btn,
      .section-collapse {
        width: 29px;
        height: 28px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        border: 1px solid #d5dfe5;
        border-radius: 5px;
        background: #fff;
        color: #526672;
        cursor: pointer;
      }
      .icon-btn:hover,
      .section-collapse:hover {
        background: #f6eaf0;
        color: var(--red);
      }
      .section-content table {
        width: 100%;
        border-collapse: collapse;
        table-layout: auto;
      }
      .section-content th {
        height: 43px;
        padding: 8px 10px;
        background: #f5f7f9;
        color: #536777;
        border: 1px solid #e0e6eb;
        font-size: 11px;
        line-height: 1.3;
        font-weight: 800;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .section-content td {
        height: 40px;
        padding: 8px 10px;
        background: #fff;
        color: #405463;
        border: 1px solid #e8edf0;
        font-size: 12px;
        white-space: nowrap;
      }
      .section-content tbody tr:nth-child(even) td {
        background: #fafbfc;
      }
      .section-content tbody tr:hover td {
        background: #f1f5f8;
      }
      .engineering-table.show-all-mode {
        width: max-content;
        min-width: 100%;
        align-items: stretch;
      }
      .engineering-table.show-all-mode .engineering-section {
        flex: 0 0 auto;
        width: max-content;
        min-width: 0;
        overflow: visible;
      }
      .engineering-table.show-all-mode .section-content {
        flex: 0 0 auto;
        width: max-content;
        min-width: 0;
      }
      .engineering-table.show-all-mode .section-content table {
        width: max-content;
        min-width: 100%;
      }
      .engineering-table.show-all-mode .section-content th,
      .engineering-table.show-all-mode .section-content td {
        white-space: nowrap;
      }
      .table-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 17px;
        color: #7a8994;
        font-size: 12px;
      }
      .stage-action-btn {
        border: 1px solid var(--red);
        color: var(--red);
        background: white;
        border-radius: 5px;
        padding: 5px 9px;
        font-size: 10px;
        font-weight: 700;
        white-space: nowrap;
      }
      .stage-action-btn:disabled {
        border-color: #d8e0e6;
        color: #a0aab3;
        background: #f5f7f9;
        cursor: not-allowed;
      }
      .modal-title {
        font-weight: 800;
        color: var(--navy);
      }
      .modal-header {
        border-top: 3px solid var(--red);
      }
      .page-title-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 16px;
      }
      .title {
        font-weight: 800;
        color: var(--navy);
      }
      .title-accent {
        height: 3px;
        width: 45px;
        background: var(--red);
        border-radius: 3px;
        margin-top: 9px;
      }
      .table-toolbar-controls {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex: 1 1 620px;
        min-width: 0;
      }
      .global-search-wrap {
        position: relative;
        flex: 1 1 260px;
        max-width: 370px;
        min-width: 190px;
      }
      .global-search-wrap > i {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: #82909a;
        font-size: 12px;
      }
      .global-search-wrap input {
        width: 100%;
        height: 34px;
        border: 1px solid #d7e0e5;
        border-radius: 6px;
        padding: 0 11px 0 32px;
        color: var(--ink);
        font-size: 11px;
        outline: none;
      }
      .global-search-wrap input:focus {
        border-color: #bb7088;
        box-shadow: 0 0 0 3px rgba(169, 21, 61, 0.07);
      }
      .table-tools {
        display: flex;
        gap: 7px;
      }
      .table-tools {
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .table-footer {
        gap: 12px;
        flex-wrap: wrap;
      }
      .table-footer-controls {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 18px;
        margin-left: auto;
      }
      .page-size {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .page-size select {
        height: 29px;
        border: 1px solid #d9e2e7;
        border-radius: 5px;
        font-size: 10px;
        padding: 0 8px;
      }
      .page-size {
        margin: 0;
        white-space: nowrap;
      }
      .page-size select {
        margin-left: 5px;
        background: #fff;
      }
      .pagination .page-link {
        font-size: 10px;
        color: #617481;
        border-color: #e0e6ea;
      }
      .pagination .active .page-link {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }
      #pagination .page-link {
        min-width: 28px;
        text-align: center;
        cursor: pointer;
      }
      #pagination .page-item.disabled .page-link {
        cursor: not-allowed;
      }
      .columns-menu {
        min-width: 255px;
        max-height: 70vh;
        overflow-y: auto;
      }
      .columns-menu-title {
        font-size: 11px;
        font-weight: 800;
        color: var(--navy);
        padding: 5px 8px 9px;
      }
      .columns-menu-options {
        display: grid;
        gap: 2px;
      }
      .columns-menu-options label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 7px 8px;
        border-radius: 5px;
        font-size: 11px;
        color: #405463;
        cursor: pointer;
      }
      .columns-menu-options label:hover {
        background: #f5eaf0;
      }
      .columns-menu-options input {
        margin-top: 2px;
        accent-color: var(--red);
      }
      @media (max-width: 900px) {
        .page {
          padding: 18px 12px;
        }
        .top-menu {
          display: none;
        }
        .filter-grid {
          grid-template-columns: 1fr 1fr;
        }
        .engineering-table {
          min-width: 650px;
        }
      }
      @media (max-width: 600px) {
        .filter-grid {
          grid-template-columns: 1fr;
        }
        .table-footer {
          align-items: flex-start;
          gap: 8px;
          flex-direction: column;
        }
      }
      @media (max-width: 700px) {
        .page-title-row {
          flex-direction: column;
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container-fluid px-4">
        <div
          class="header-inner d-flex align-items-center justify-content-between gap-3"
        >
          <a class="mahindra-logo" href="#"
            ><img src="mahindra_rise_red.png" alt="Mahindra"
          /></a>
          <nav class="top-menu">
            <a href="mahindra_engineering_dashboard.html"
              ><i class="bi bi-grid-1x2 me-1"></i>Dashboard</a
            >
            <!-- <a href="mahindra_engineering_input_bd.html"
              ><i class="bi bi-folder2-open me-1"></i>Input BD</a
            >
            <a href="mahindra_programs.html"
              ><i class="bi bi-folder2-open me-1"></i>Programs</a
            ><a href="mahindra_engineering_records.html"
              ><i class="bi bi-folder2-open me-1"></i>Engineering 1</a
            ><a href="mahindra_engineering_records_new.html"
              ><i class="bi bi-folder2-open me-1"></i>Engineering 2</a
            > -->
            <a class="active" href="mahindra_tooling_tracker.html">
              <i class="bi bi-tools me-1"></i>Tooling
            </a>
            <a href="#"><i class="bi bi-bar-chart-line me-1"></i>Reports</a>
          </nav>
          <div class="dropdown">
            <button
              class="profile-btn dropdown-toggle"
              data-bs-toggle="dropdown"
            >
              <div>
                <div class="profile-name">Priyank Jain</div>
                <div class="profile-role">Tooling User</div>
              </div>
              <span class="avatar">PJ</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end mt-2">
              <li>
                <a class="dropdown-item" href="#"
                  ><i class="bi bi-person me-2"></i>My Profile</a
                >
              </li>
              <li>
                <a class="dropdown-item" href="#"
                  ><i class="bi bi-gear me-2"></i>Settings</a
                >
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <a
                  class="dropdown-item text-danger"
                  href="mahindra_engineering_login.html"
                  ><i class="bi bi-box-arrow-right me-2"></i>Logout</a
                >
              </li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    <main class="page">
      <div class="page-title-row">
        <div>
          <h5 class="title mb-1">Tooling Tracker</h5>
          <div class="title-accent"></div>
        </div>
      </div>

      <section class="filter-card">
        <div class="filter-grid">
          <div>
            <div class="filter-label">Customer</div>
            <input
              id="filterCustomer"
              class="form-control filter-control"
              placeholder="Search customer"
            />
          </div>
          <div>
            <div class="filter-label">Part Number</div>
            <input
              id="filterPart"
              class="form-control filter-control"
              placeholder="Search part number"
            />
          </div>
          <div>
            <div class="filter-label">Tool Description</div>
            <input
              id="filterTool"
              class="form-control filter-control"
              placeholder="Search tool description"
            />
          </div>
          <div class="d-flex gap-2">
            <button class="apply" onclick="applyFilters()">
              <i class="bi bi-funnel me-1"></i>Apply</button
            ><button
              class="tool-btn"
              onclick="clearFilters()"
              title="Clear filters"
            >
              <i class="bi bi-arrow-counterclockwise"></i>
            </button>
          </div>
        </div>
      </section>
      <section class="table-card">
        <div class="table-head table-head-toolbar">
          <div class="table-heading-block">
            <div class="table-title">
              Tooling Records
              <span class="table-meta">(<span id="recordCount">10</span>)</span>
            </div>
          </div>
          <div class="table-toolbar-controls">
            <div class="global-search-wrap">
              <i class="bi bi-search"></i>
              <input
                id="globalSearch"
                placeholder="Search..."
                oninput="
                  currentPage = 1;
                  render();
                "
              />
            </div>
            <div class="table-tools">
              <button
                class="tool-btn"
                onclick="exportAll()"
                title="Export records to CSV"
              >
                <i class="bi bi-download me-1"></i>Export
              </button>
              <button
                class="tool-btn"
                onclick="document.getElementById('excelUpload').click()"
                title="Upload Excel file"
              >
                <i class="bi bi-upload me-1"></i>Upload
              </button>
              <input
                id="excelUpload"
                type="file"
                accept=".xlsx,.xls,.csv"
                hidden
                onchange="uploadExcel(event)"
              />
              <div class="dropdown">
                <button
                  class="tool-btn dropdown-toggle"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <i class="bi bi-sliders me-1"></i>Columns
                </button>
                <div class="dropdown-menu dropdown-menu-end columns-menu p-2">
                  <div class="columns-menu-title">Show sections</div>
                  <div class="columns-menu-options">
                    <label
                      ><input
                        type="checkbox"
                        checked
                        onchange="
                          toggleSectionVisibility('master', this.checked)
                        "
                      />
                      Tool Master / Project</label
                    >
                    <label
                      ><input
                        type="checkbox"
                        checked
                        onchange="
                          toggleSectionVisibility('gate1', this.checked)
                        "
                      />
                      Gate 1 — Tool Design</label
                    >
                    <label
                      ><input
                        type="checkbox"
                        checked
                        onchange="toggleSectionVisibility('scm', this.checked)"
                      />
                      SCM / Manufacturing</label
                    >
                    <label
                      ><input
                        type="checkbox"
                        checked
                        onchange="
                          toggleSectionVisibility('gate2', this.checked)
                        "
                      />
                      Gate 2 — Tooling Quality &amp; Buy-Off</label
                    >
                    <label
                      ><input
                        type="checkbox"
                        checked
                        onchange="
                          toggleSectionVisibility('gate3', this.checked)
                        "
                      />
                      Gate 3 — FAI Tool Proveout</label
                    >
                    <label
                      ><input
                        type="checkbox"
                        checked
                        onchange="
                          toggleSectionVisibility('gate4', this.checked)
                        "
                      />
                      Gate 4 — Handover &amp; Tool Life Cycle</label
                    >
                  </div>
                </div>
              </div>
              <button class="tool-btn" onclick="expandAllSections()">
                <i class="bi bi-arrows-expand me-1"></i>Show all
              </button>
            </div>
          </div>
        </div>
        <div class="engineering-table-wrap" id="tableWrap">
          <div class="engineering-table" id="engineeringTable"></div>
        </div>
        <div class="table-footer">
          <div class="table-footer-info">
            Showing <strong id="showing">1 to 10</strong> of
            <strong id="total">10</strong> records
          </div>
          <div class="table-footer-controls">
            <nav aria-label="Engineering records pagination">
              <ul id="pagination" class="pagination pagination-sm mb-0"></ul>
            </nav>
            <label class="page-size" for="pageSizeSelect">
              Rows per page
              <select id="pageSizeSelect" onchange="changePageSize(this.value)">
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </label>
          </div>
        </div>
      </section>
    </main>
    <div class="modal fade" id="stageModal" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Tooling Stage</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form id="stageForm">
            <div class="modal-body">
              <div class="row g-3" id="modalFields"></div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Cancel</button
              ><button
                type="submit"
                class="btn btn-danger"
                style="background: #a9153d"
              >
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <input type="file" id="sectionUpload" accept=".xlsx,.xls,.csv" hidden />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
      const SECTIONS = [
        {
          key: "master",
          title: "TOOL MASTER / PROJECT",
          icon: "bi-folder2-open",
          fields: [
            "SR. NO.",
            "CUSTOMER",
            "PROJECT",
            "DERIVABLE PART NO",
            "PART NO",
            "SAP NO",
            "ANNUAL DEMAND",
            "PART LAUNCH DATE",
            "TOOL LOB DATE",
            "C.E INPUT DATA VALIDATION",
            "REMARKS (C.E)",
          ],
        },
        {
          key: "gate1",

        const pagination = document.getElementById("pagination");

        const item = (
          label,
          page,
          disabled = false,
          active = false,
          aria = "",
        ) =>
          `<li class="page-item ${disabled ? "disabled" : ""} ${active ? "active" : ""}">
             <button class="page-link" type="button" ${disabled ? "disabled" : ""} ${aria ? `aria-label="${aria}"` : ""}
               onclick="goToPage(${page})">${label}</button></li>`;
        let out = item(
          "&laquo;",
          currentPage - 1,
          currentPage === 1,
          false,
          "Previous page",
        );
        let first = Math.max(1, currentPage - 2);
        let last = Math.min(totalPages, first + 4);
        first = Math.max(1, last - 4);
        for (let n = first; n <= last; n++)
          out += item(n, n, false, n === currentPage, `Page ${n}`);

          "&raquo;",
          currentPage + 1,
          currentPage === totalPages,
          false,
          "Next page",
        );

        const wb = XLSX.utils.book_new();
        SECTIONS.forEach((s) =>
          XLSX.utils.book_append_sheet(
            wb,
            XLSX.utils.json_to_sheet(sectionRows(s.key)),
            s.title.slice(0, 31),
          ),
        );
        XLSX.writeFile(wb, "Mahindra_Tooling_Tracker.xlsx");
      }
      function uploadSection(key) {
        activeSection = key;
        $("sectionUpload").value = "";
        $("sectionUpload").click();
      }
      $("sectionUpload").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!window.XLSX) {
          alert("Excel library needs an internet connection.");
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const wb = XLSX.read(ev.target.result, { type: "array" }),
              ws = wb.Sheets[wb.SheetNames[0]],
              data = XLSX.utils.sheet_to_json(ws, { defval: "" });
            const s = SECTIONS.find((x) => x.key === activeSection);
            let updated = 0;
            data.forEach((row) => {
              const part = String(row["PART NO"] || "").trim(),
                customer = String(row["CUSTOMER"] || "").trim();
              if (!part) return;
              const rec = records.find(
                (r) =>
                  String(r["PART NO"]).trim() === part &&
                  (!customer || String(r["CUSTOMER"]).trim() === customer),
              );
              if (!rec) return;
              s.fields.forEach((f) => {
                if (
                  Object.prototype.hasOwnProperty.call(row, f) &&
                  f !== "SR. NO."
                )
                  rec[f] = row[f];
              });
              updated++;
            });
            if (updated) {
              records.forEach((r, i) => {
                if (r[s.fields.find((f) => f !== "SR. NO.")])
                  stageDone[i + "_" + activeSection] = true;
              });
              render();
              alert(
                `${updated} record(s) updated in ${s.title}. Other sections were not changed.`,
              );
            } else
              alert(
                "No matching records found. Keep PART NO and CUSTOMER columns from the exported template.",
              );
          } catch (err) {
            alert(
              "Unable to read this file. Please upload the section Excel exported from this page.",
            );
          }
        };
        reader.readAsArrayBuffer(file);
      });
      init();
    </script>
  </body>
</html>
